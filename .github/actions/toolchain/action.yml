name: Toolchain
description: Install c3c, cached by version.

# Versions come in as inputs. A composite action does not see the caller's
# workflow-level `env` inside `with:` expressions, so the cache key below would
# be empty if it read env directly. The caller passes it explicitly.
inputs:
  c3c-version:
    description: c3c release version to install.
    required: true

runs:
  using: composite
  steps:
    # c3c's official x86-64 Linux binary runs natively on ubuntu-latest, with no
    # emulation, unlike the arm64 container in ci/linux. The version is fixed, so
    # cache it.
    - name: Cache c3c
      id: cache-c3c
      uses: actions/cache@v4
      with:
        path: /opt/c3c
        key: c3c-${{ inputs.c3c-version }}-linux-x64
    - name: Install c3c
      if: steps.cache-c3c.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL -o /tmp/c3c.tar.gz \
          "https://github.com/c3lang/c3c/releases/download/v${{ inputs.c3c-version }}/c3-linux.tar.gz"
        mkdir -p /opt/c3c
        tar xzf /tmp/c3c.tar.gz -C /opt/c3c --strip-components=1
    - name: Put c3c on PATH
      shell: bash
      run: echo "/opt/c3c" >> "$GITHUB_PATH"
