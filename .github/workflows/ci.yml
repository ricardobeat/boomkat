name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels an in-flight run — the old result
# is stale the moment the new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  C3C_VERSION: "0.8.2"
  # bellard/quickjs pin. project.json sources cutils.c/dtoa.c from here; it is
  # also the QuickJS the differential oracle (out/qjs) is built from.
  QUICKJS_REF: "d73189dd5a582c19c565774bd56fed4e72d33c99"

jobs:
  # Gate the whole pipeline: a docs-only, plans-only, or bindings-only push must
  # not build the engine or run any suite. Everything that can change engine
  # behavior or how it's exercised counts as "engine".
  filter:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.paths.outputs.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            engine:
              - 'src/**'
              - 'cli/**'
              - 'libregexp/**'
              - 'include/**'
              - 'test/**'
              - 'scripts/**'
              - 'ci/**'
              - 'project.json'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # Build the engine, the batch test262 runner, and the QuickJS oracle once,
  # then hand them to the parallel suite jobs as an artifact. Building here means
  # the toolchain is installed and the engine compiled a single time.
  build:
    name: build
    needs: filter
    if: needs.filter.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain

      # `make boomkat` and `make out/test262_runner` produce the binaries the
      # suite jobs consume; out/qjs is the JS-corpus differential oracle.
      - name: Build engine + test262 runner + qjs oracle
        run: |
          make boomkat
          make out/test262_runner
          make -C quickjs qjs
          cp quickjs/qjs out/

      - uses: actions/upload-artifact@v4
        with:
          name: engine-bin
          path: out/
          retention-days: 1
          if-no-files-found: error

  # ── Parallel suites, all consuming the prebuilt out/ ────────────────────────

  tests:
    name: tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-bin
          path: out
      - run: chmod +x out/boomkat
      # The whole checked-in engine suite, run against the prebuilt binary.
      - name: Local test suite
        run: bash test/run_local.sh

  conformance:
    name: ts conformance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-bin
          path: out
      - run: chmod +x out/boomkat
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # tsc is the accept/reject oracle for the conformance corpus.
      - name: Install TypeScript
        run: npm install -g typescript@5.6.3
      # microsoft/TypeScript sparse clone; cache keyed on the fetcher (its clone
      # ref lives there), restore-keys reuses the prior clone across script edits.
      - name: Cache TS conformance corpus
        uses: actions/cache@v4
        with:
          path: |
            test/typescript/conformance-src
            test/typescript/ts_conformance_cache
          key: ts-conformance-${{ hashFiles('scripts/fetch_ts_conformance.py') }}
          restore-keys: ts-conformance-
      - name: TS conformance corpus
        run: |
          python3 scripts/fetch_ts_conformance.py
          python3 scripts/run_ts_conformance.py

  test262:
    name: test262
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The runner reads test files from the test262/ submodule at run time.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: engine-bin
          path: out
      - run: chmod +x out/test262_runner out/boomkat
      # The gate runs the full suite once and exits non-zero unless it reports
      # zero fails across every phase (it folds in every non-pass verdict). Same
      # script `just test262-gate` uses — one source of truth.
      - name: test262 zero-fail gate
        run: bash scripts/test262_gate.sh

  corpus:
    name: library corpus
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-bin
          path: out
      - run: chmod +x out/boomkat out/qjs
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install TypeScript
        run: npm install -g typescript@5.6.3
      # Both fetchers are content-addressed (skip files already present), so a
      # restored cache turns fetching into a no-op; restore-keys lets a single
      # URL/pin bump re-download one file instead of the whole corpus.
      - name: Cache JS library corpus
        uses: actions/cache@v4
        with:
          path: test/libcorpus
          key: libcorpus-${{ hashFiles('scripts/verify_libraries.py') }}
          restore-keys: libcorpus-
      - name: Cache TS library corpus
        uses: actions/cache@v4
        with:
          path: test/tscorpus
          key: tscorpus-${{ hashFiles('scripts/verify_ts_libraries.py') }}
          restore-keys: tscorpus-
      - name: JS library corpus
        run: python3 scripts/verify_libraries.py
      - name: TS library corpus
        run: python3 scripts/verify_ts_libraries.py
