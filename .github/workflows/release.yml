name: Release

on:
  push:
    tags:
      - 'v0.0*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  C3C_VERSION: '0.8.3'
  QJS_NG_VERSION: 'v0.16.2'
  TS_VERSION: '7.0.2'

jobs:
  check:
    name: Check committed version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Match VERSION, CLI, and tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_release_version.py
          fi

  validate:
    name: Release gates
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/toolchain
        with:
          c3c-version: ${{ env.C3C_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install TypeScript
        run: npm install -g typescript@${TS_VERSION}
      - name: Build validation targets
        run: make out/boomkat out/boomkat.a out/test262_runner out/test262_runner_verify
      - name: CLI and embedding smoke
        run: |
          make smoke
          test "$(out/boomkat --version)" = "boomkat $(cat VERSION)"
          test "$(printf 'print(6*7)\n' | out/boomkat)" = '42'
          out/boomkat --help
      - name: Local suite
        run: bash test/run_local.sh
      - name: TypeScript conformance
        run: |
          python3 scripts/fetch_ts_conformance.py
          python3 scripts/run_ts_conformance.py
      - name: test262 zero-fail gate
        run: bash scripts/test262_gate.sh
      - name: Heap verifier shard
        run: bash scripts/test262_verify.sh
      - name: Fetch QuickJS reference
        run: |
          curl -fsSL -o out/qjs "https://github.com/quickjs-ng/quickjs/releases/download/${QJS_NG_VERSION}/qjs-linux-x86_64"
          chmod +x out/qjs
      - name: JavaScript library corpus
        run: python3 scripts/verify_libraries.py
      - name: TypeScript library corpus
        run: python3 scripts/verify_ts_libraries.py

  build:
    name: ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/toolchain
        if: runner.os != 'Windows'
        with:
          c3c-version: ${{ env.C3C_VERSION }}
      - name: Install C3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'c3-windows.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'c3-unpack'
          $install = Join-Path $env:RUNNER_TEMP 'c3c'
          Invoke-WebRequest -Uri "https://github.com/c3lang/c3c/releases/download/v${env:C3C_VERSION}/c3-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $unpack
          $compiler = Get-ChildItem $unpack -Recurse -Filter c3c.exe | Select-Object -First 1
          if (-not $compiler) { throw 'c3-windows.zip contains no c3c.exe' }
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          Copy-Item -Recurse -Force (Join-Path $compiler.DirectoryName '*') $install
          Add-Content -Path $env:GITHUB_PATH -Value $install
          & (Join-Path $install 'c3c.exe') --version
      - name: Build Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.platform }}' == macos-x64 ]]; then
            cat > "$RUNNER_TEMP/cc-macos-x64" <<'CC'
          #!/bin/sh
          exec clang -arch x86_64 "$@"
          CC
            chmod +x "$RUNNER_TEMP/cc-macos-x64"
            export MACOSX_DEPLOYMENT_TARGET=15.0
            c3c build boomkat --target macos-x64 --cc "$RUNNER_TEMP/cc-macos-x64" --macos-min-version 15.0
            c3c build boomkat_slim --target macos-x64 --cc "$RUNNER_TEMP/cc-macos-x64" --macos-min-version 15.0
            c3c build boomkat_static --target macos-x64 --cc "$RUNNER_TEMP/cc-macos-x64" --macos-min-version 15.0
          elif [[ '${{ matrix.platform }}' == macos-arm64 ]]; then
            export MACOSX_DEPLOYMENT_TARGET=15.0
            c3c build boomkat --macos-min-version 15.0
            c3c build boomkat_slim --macos-min-version 15.0
            c3c build boomkat_static --macos-min-version 15.0
          else
            c3c build boomkat
            c3c build boomkat_slim
            c3c build boomkat_static
          fi
      - name: Build Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          c3c build boomkat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          c3c build boomkat_slim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          c3c build boomkat_static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for binary in out/boomkat out/boomkat_slim; do
            file "$binary"
            test "$("$binary" --version)" = "boomkat $(cat VERSION)"
            test "$(printf 'print(6*7)\n' | "$binary")" = '42'
          done
          if [[ '${{ matrix.platform }}' == macos-x64 ]]; then
            clang -arch x86_64 -std=c99 -Iinclude test/capi/smoke.c out/boomkat.a -o out/lib_smoke
          elif [[ '${{ matrix.platform }}' == macos-arm64 ]]; then
            clang -std=c99 -Iinclude test/capi/smoke.c out/boomkat.a -o out/lib_smoke
          else
            cc -std=c99 -Iinclude test/capi/smoke.c out/boomkat.a -lm -ldl -o out/lib_smoke
          fi
          test "$(out/lib_smoke)" = '42'
      - name: Smoke Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = 'boomkat ' + (Get-Content VERSION -Raw).Trim()
          foreach ($binary in @('out/boomkat.exe', 'out/boomkat_slim.exe')) {
            if ((& $binary --version) -ne $expected) { throw "version failed: $binary" }
            if (('print(6*7)' | & $binary) -ne '42') { throw "execution failed: $binary" }
          }
      - name: Package Unix release assets
        if: runner.os != 'Windows'
        run: python3 scripts/package_release.py --platform '${{ matrix.platform }}'
      - name: Package Windows release assets
        if: runner.os == 'Windows'
        run: python scripts/package_release.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [check, validate, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staged
      - name: Collect and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          find staged -type f ! -name 'SHA256SUMS-*' -exec cp {} dist/ \;
          cat staged/*/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          cd dist
          sha256sum -c SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
